# tmuse game config.
#
# Key bindings are left at stock tmux defaults on purpose: everything you learn
# here works in a fresh tmux anywhere. The only changes are:

# vi keys in copy mode (tmux picks emacs keys unless $EDITOR mentions vi).
setw -g mode-keys vi

# Keep the server alive with zero sessions so closing your last pane doesn't
# end the game. (Stock tmux exits when the last session ends.)
set -g exit-empty off

# Three status lines: two for the game's HUD, then the normal tmux status bar.
# The engine fills in status-format[0] and [1].
set -g status 3
set -g status-interval 1

# The game reads tmux's message log to see which keys you press. A shorter log
# keeps that quick. (Stock tmux keeps 1000 messages.)
set -g message-limit 100
